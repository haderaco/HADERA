<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — HADÉRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .catalog-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .filters-panel {
      position: sticky;
      top: 90px;
      background: var(--color-bg-raised);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-m);
      padding: 1.5rem;
    }

    .filters-panel h3 {
      font-size: 1rem;
      margin-bottom: 1.1rem;
    }

    .filter-group {
      margin-bottom: 1.4rem;
    }

    .filter-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-s);
      background: var(--color-bg);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-input-wrap input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-s);
      background: var(--color-bg-raised);
    }

    .search-input-wrap svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }

    .sort-select {
      padding: 0.8rem 1rem;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-s);
      background: var(--color-bg-raised);
    }

    .filters-open-btn {
      display: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .result-count {
      font-size: 0.85rem;
      color: var(--color-ink-soft);
    }

    .filters-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 17, 12, 0.4);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .filters-sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .filters-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      background: var(--color-bg);
      border-radius: 18px 18px 0 0;
      padding: 1.5rem var(--gutter) 2rem;
      transform: translateY(100%);
      transition: transform .4s var(--ease);
      max-height: 82vh;
      overflow-y: auto;
    }

    .filters-sheet.open {
      transform: translateY(0);
    }

    .filters-sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--color-line);
      border-radius: 2px;
      margin: 0 auto 1.2rem;
    }

    .filters-sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    @media (max-width: 900px) {
      .catalog-layout {
        grid-template-columns: 1fr;
      }

      .filters-panel {
        display: none;
      }

      .filters-open-btn {
        display: inline-flex;
      }
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main>
    <div class="page-banner">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Shop</div>
        <span class="eyebrow">Catalog</span>
        <h1>All products</h1>
        <p>Browse verified cars and furniture, or narrow down using the filters.</p>
      </div>
    </div>

    <div class="section">
      <div class="container catalog-layout">

        <!-- Desktop filters -->
        <aside class="filters-panel" id="filters-panel-desktop">
          <h3>Filters</h3>
          <div class="filter-group">
            <label for="f-category">Category</label>
            <select id="f-category">
              <option value="">All categories</option>
              <option value="cars">Cars</option>
              <option value="furniture">Furniture</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-location">Location</label>
            <select id="f-location">
              <option value="">All locations</option>
              <option value="Abuja">Abuja</option>
              <option value="Lagos">Lagos</option>
              <option value="Port Harcourt">Port Harcourt</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-min">Min price (₦)</label>
            <input type="number" id="f-min" placeholder="0" min="0">
          </div>
          <div class="filter-group">
            <label for="f-max">Max price (₦)</label>
            <input type="number" id="f-max" placeholder="Any" min="0">
          </div>
          <button class="btn btn-secondary btn-block btn-sm" id="clear-filters">Clear filters</button>
        </aside>

        <div>
          <div class="toolbar">
            <div class="search-input-wrap">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4" />
                <path d="M14 14l-3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
              <input type="search" id="f-search" placeholder="Search products…">
            </div>
            <button class="btn btn-secondary btn-sm filters-open-btn" id="open-filters">Filters</button>
            <select class="sort-select" id="f-sort">
              <option value="">Sort: featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="newest">Newest first</option>
            </select>
          </div>
          <p class="result-count" id="result-count"></p>
          <div class="product-grid mt-l" id="catalog-grid"></div>
          <div class="pagination">
            <button class="btn btn-secondary" id="load-more" style="display:none">Load more</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Mobile filters bottom sheet -->
  <div class="filters-sheet-backdrop" id="sheet-backdrop"></div>
  <div class="filters-sheet" id="filters-sheet">
    <div class="filters-sheet-handle"></div>
    <div class="filters-sheet-top">
      <h3 style="margin:0;font-size:1.1rem">Filters</h3>
      <button class="nav-icon-btn" id="close-sheet" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div class="filter-group">
      <label for="fm-category">Category</label>
      <select id="fm-category">
        <option value="">All categories</option>
        <option value="cars">Cars</option>
        <option value="furniture">Furniture</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="fm-location">Location</label>
      <select id="fm-location">
        <option value="">All locations</option>
        <option value="Abuja">Abuja</option>
        <option value="Lagos">Lagos</option>
        <option value="Port Harcourt">Port Harcourt</option>
      </select>
    </div>
    <div class="field-row">
      <div class="filter-group"><label for="fm-min">Min price (₦)</label><input type="number" id="fm-min"
          placeholder="0"></div>
      <div class="filter-group"><label for="fm-max">Max price (₦)</label><input type="number" id="fm-max"
          placeholder="Any"></div>
    </div>
    <button class="btn btn-primary btn-block" id="apply-sheet">Apply filters</button>
  </div>

  <script src="js/main.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/products.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order received — HADÉRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .success-wrap {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-accent-soft);
      color: var(--color-accent-ink);
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
    }

    .success-card {
      text-align: left;
      background: var(--color-bg-raised);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-l);
      padding: 1.6rem;
      margin-top: 2rem;
    }

    .success-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--color-line);
      font-size: 0.92rem;
    }

    .success-row:last-child {
      border-bottom: 0;
    }

    .success-row span:first-child {
      color: var(--color-ink-soft);
    }

    .status-pill {
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--color-accent-soft);
      color: var(--color-accent-ink);
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main>
    <div class="section">
      <div class="container success-wrap">
        <div class="success-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <span class="eyebrow">Step 3 of 3</span>
        <h1 style="font-size:var(--step-3);margin-top:0.6rem">Order received</h1>
        <p style="color:var(--color-ink-soft);margin-top:0.8rem">Thank you — our team will reach out shortly to confirm
          the details of your order.</p>

        <div class="success-card" id="order-details">
          <div class="skeleton" style="height:16px;margin-bottom:12px"></div>
          <div class="skeleton" style="height:16px;margin-bottom:12px"></div>
          <div class="skeleton" style="height:16px"></div>
        </div>

        <div class="hero-ctas" style="justify-content:center;margin-top:2rem">
          <a href="products.html" class="btn btn-primary">Continue shopping</a>
          <a href="index.html" class="btn btn-secondary">Back to home</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('order');
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem('hadera_last_order') || 'null'); } catch (e) { }

      const el = HADERA.qs('#order-details');
      if (saved && saved.orderId === orderId) {
        el.innerHTML = `
        <div class="success-row"><span>Order reference</span><span><strong>${saved.orderId}</strong></span></div>
        <div class="success-row"><span>Product</span><span>${saved.product}</span></div>
        <div class="success-row"><span>Amount</span><span>${HADERA.formatNaira(saved.amount)}</span></div>
        <div class="success-row"><span>Customer</span><span>${saved.customerName}</span></div>
        <div class="success-row"><span>Payment status</span><span class="status-pill">Pending</span></div>
      `;
      } else {
        el.innerHTML = `
        <div class="success-row"><span>Order reference</span><span><strong>${orderId || '—'}</strong></span></div>
        <div class="success-row"><span>Payment status</span><span class="status-pill">Pending</span></div>
      `;
      }
    });
  </script>
</body>

</html>

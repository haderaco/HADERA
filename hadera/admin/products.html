<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — HADÉRA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .product-thumb {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: var(--radius-s);
    }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
  </style>
</head>

<body class="admin-body">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">

        <div class="admin-panel reveal">
          <div class="admin-panel-head">
            <h2>All products</h2>
            <button class="btn btn-primary btn-sm" id="add-product-btn">+ Add product</button>
          </div>
          <div class="admin-panel-body">
            <div class="admin-toolbar" style="margin-bottom:1.4rem">
              <input type="search" id="p-search" placeholder="Search products…" style="flex:1;min-width:200px">
              <select id="p-category">
                <option value="">All categories</option>
                <option value="cars">Cars</option>
                <option value="furniture">Furniture</option>
              </select>
              <select id="p-status">
                <option value="">All statuses</option>
                <option value="available">Available</option>
                <option value="reserved">Reserved</option>
                <option value="sold">Sold</option>
              </select>
            </div>
            <div class="table-scroll">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="products-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Add/Edit product drawer -->
  <div class="modal-backdrop" id="product-modal-backdrop"></div>
  <div class="modal" id="product-modal">
    <div class="modal-head">
      <h3 id="product-modal-title">Add product</h3>
      <button class="icon-btn" id="product-modal-close" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <form id="product-form">
      <div class="field">
        <label for="pf-name">Product name</label>
        <input type="text" id="pf-name" name="name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pf-category">Category</label>
          <select id="pf-category" name="category" required>
            <option value="cars">Cars</option>
            <option value="furniture">Furniture</option>
          </select>
        </div>
        <div class="field">
          <label for="pf-price">Price (₦)</label>
          <input type="number" id="pf-price" name="price" required min="0">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pf-location">Location</label>
          <input type="text" id="pf-location" name="location" required>
        </div>
        <div class="field">
          <label for="pf-quantity">Quantity</label>
          <input type="number" id="pf-quantity" name="quantity" value="1" min="0">
        </div>
      </div>
      <div class="field">
        <label for="pf-availability">Availability</label>
        <select id="pf-availability" name="availability">
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold out</option>
        </select>
      </div>
      <div class="field">
        <label for="pf-description">Description</label>
        <textarea id="pf-description" name="description"></textarea>
      </div>
      <div class="field">
        <label for="pf-images">Images</label>
        <input type="file" id="pf-images" name="images" multiple accept="image/*">
        <span class="hint">Upload will be wired to the backend's media storage.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save product</button>
    </form>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/products-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/admin-products.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — HADÉRA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e5e5e5);
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.06);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .login-brand p {
            margin: 0;
            color: #777;
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid var(--border-color, #ddd);
            border-radius: 10px;
            background: transparent;
            color: inherit;
            font: inherit;
            outline: none;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #315c43;
            box-shadow: 0 0 0 3px rgba(49, 92, 67, 0.1);
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.88rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            width: auto;
        }

        .login-submit {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px 18px;
            background: #315c43;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .login-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-message {
            display: none;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .login-message.error {
            display: block;
            background: #fff1f1;
            color: #a52222;
            border: 1px solid #f0caca;
        }

        .login-message.success {
            display: block;
            background: #eef8f1;
            color: #27613d;
            border: 1px solid #c9e4d2;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }

        .login-footer a {
            color: #315c43;
            font-weight: 600;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: inherit;
            text-decoration: none;
            font-size: 0.88rem;
            opacity: 0.7;
        }

        .back-home:hover {
            opacity: 1;
        }

        @media (max-width: 520px) {
            .login-page {
                padding: 25px 15px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 14px;
            }

            .login-brand h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <div class="login-card">

                <div class="login-brand">
                    <h1>Welcome back</h1>

                    <p>
                        Sign in to your HADÉRA account
                    </p>
                </div>

                <form id="loginForm" class="login-form">

                    <div class="form-group">
                        <label for="email">
                            Email address
                        </label>

                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>

                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <div class="login-options">

                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" checked>

                            <span>
                                Remember me
                            </span>
                        </label>

                    </div>

                    <div id="loginMessage" class="login-message"></div>

                    <button type="submit" class="login-submit" id="loginButton">
                        Log in
                    </button>

                </form>

                <div class="login-footer" id="customerFooter">
                    Don't have an account?

                    <a href="account/signup.html">
                        Create one
                    </a>
                </div>

                <a href="index.html" class="back-home">
                    ← Back to HADÉRA
                </a>

            </div>

        </div>

    </main>


    <!-- Unified authentication -->
    <script src="js/api.js"></script>


    <script>

        const loginForm =
            document.getElementById('loginForm');

        const loginButton =
            document.getElementById('loginButton');

        const loginMessage =
            document.getElementById('loginMessage');

        const emailInput =
            document.getElementById('email');

        const passwordInput =
            document.getElementById('password');

        const rememberMe =
            document.getElementById('rememberMe');


        /*
        |--------------------------------------------------------------------------
        | MESSAGE
        |--------------------------------------------------------------------------
        */

        function showMessage(
            message,
            type = 'error'
        ) {
            loginMessage.textContent = message;

            loginMessage.className =
                `login-message ${type}`;
        }


        function clearMessage() {
            loginMessage.textContent = '';

            loginMessage.className =
                'login-message';
        }


        /*
        |--------------------------------------------------------------------------
        | LOGIN
        |--------------------------------------------------------------------------
        */

        loginForm.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();

                clearMessage();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;

                const remember =
                    rememberMe.checked;


                if (!email || !password) {

                    showMessage(
                        'Please enter your email and password.'
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    'Signing in...';


                try {

                    const result =
                        await loginUnified(
                            email,
                            password,
                            remember
                        );


                    showMessage(
                        'Login successful. Redirecting...',
                        'success'
                    );


                    /*
                    |--------------------------------------------------------------------------
                    | AUTOMATIC ROLE REDIRECT
                    |--------------------------------------------------------------------------
                    */

                    if (
                        result.role === 'admin'
                    ) {

                        window.location.replace(
                            'admin/dashboard.html'
                        );

                    } else {

                        window.location.replace(
                            'account/dashboard.html'
                        );

                    }

                } catch (error) {

                    showMessage(
                        error?.message ||
                        'Unable to log in. Please check your details and try again.'
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        'Log in';
                }

            }
        );

    </script>

</body>

</html>

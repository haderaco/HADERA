<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — HADÉRA</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .account-page {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
        }

        .account-card {
            width: min(100%, 560px);
            background: var(--color-surface);
            border: 1px solid var(--color-line);
            border-radius: var(--radius-lg);
            padding: 2.25rem;
            box-shadow: var(--shadow-soft);
        }

        .account-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .account-header h1 {
            margin-bottom: 0.5rem;
        }

        .account-header p {
            color: var(--color-ink-soft);
            margin: 0;
        }

        .account-form {
            display: grid;
            gap: 1rem;
        }

        .account-form .field-row {
            margin-bottom: 0;
        }

        .account-submit {
            width: 100%;
            margin-top: 0.5rem;
        }

        .account-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-ink-soft);
            font-size: 0.9rem;
        }

        .account-footer a {
            font-weight: 600;
        }

        .account-message {
            display: none;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }

        .account-message.show {
            display: block;
        }

        .account-message.error {
            background: #fdf0f0;
            color: #9b2c2c;
            border: 1px solid #efcaca;
        }

        .account-message.success {
            background: #eef8f1;
            color: #2d6843;
            border: 1px solid #cce5d4;
        }

        .password-note {
            color: var(--color-ink-faint);
            font-size: 0.75rem;
            margin-top: -0.5rem;
        }

        @media (max-width: 600px) {
            .account-page {
                padding: 2rem 1rem;
            }

            .account-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>

    <main class="account-page">

        <section class="account-card">

            <div class="account-header">
                <h1>Create your account</h1>
                <p>
                    Create a HADÉRA account to track your orders
                    and manage your details.
                </p>
            </div>

            <div id="account-message" class="account-message"></div>

            <form id="signup-form" class="account-form">

                <div class="field">
                    <label for="name">
                        Full name
                    </label>

                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">
                        Email
                    </label>

                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="field-row">

                    <div class="field">
                        <label for="phone">
                            Phone
                        </label>

                        <input id="phone" name="phone" type="tel" autocomplete="tel">
                    </div>

                    <div class="field">
                        <label for="city">
                            City
                        </label>

                        <input id="city" name="city" type="text" autocomplete="address-level2">
                    </div>

                </div>

                <div class="field">
                    <label for="state">
                        State
                    </label>

                    <input id="state" name="state" type="text" autocomplete="address-level1">
                </div>

                <div class="field">
                    <label for="address">
                        Address
                    </label>

                    <textarea id="address" name="address" rows="3" autocomplete="street-address"></textarea>
                </div>

                <div class="field">
                    <label for="password">
                        Password
                    </label>

                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8"
                        required>

                    <div class="password-note">
                        Password must be at least 8 characters.
                    </div>
                </div>

                <label class="checkbox-row">
                    <input id="rememberMe" name="rememberMe" type="checkbox" checked>

                    <span>
                        Keep me signed in
                    </span>
                </label>

                <button type="submit" class="btn btn-primary account-submit" id="signup-button">
                    Create account
                </button>

            </form>

            <div class="account-footer">
                Already have an account?
                <a href="login.html">
                    Log in
                </a>
            </div>

        </section>

    </main>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>
    <script src="../js/customer-api.js"></script>

    <script>
        document.addEventListener(
            'DOMContentLoaded',
            () => {
                const form =
                    document.getElementById(
                        'signup-form'
                    );

                const button =
                    document.getElementById(
                        'signup-button'
                    );

                const message =
                    document.getElementById(
                        'account-message'
                    );

                function showMessage(
                    text,
                    type = 'error'
                ) {
                    message.textContent = text;
                    message.className =
                        `account-message show ${type}`;
                }

                if (
                    typeof isCustomerLoggedIn ===
                    'function' &&
                    isCustomerLoggedIn()
                ) {
                    window.location.replace(
                        'dashboard.html'
                    );

                    return;
                }

                form.addEventListener(
                    'submit',
                    async event => {
                        event.preventDefault();

                        message.className =
                            'account-message';

                        button.disabled = true;
                        button.textContent =
                            'Creating account...';

                        try {
                            const formData =
                                new FormData(form);

                            const result =
                                await signupCustomer(
                                    {
                                        name:
                                            formData.get('name')
                                                .trim(),

                                        email:
                                            formData.get('email')
                                                .trim(),

                                        phone:
                                            formData.get('phone')
                                                .trim(),

                                        password:
                                            formData.get('password'),

                                        state:
                                            formData.get('state')
                                                .trim(),

                                        city:
                                            formData.get('city')
                                                .trim(),

                                        address:
                                            formData.get('address')
                                                .trim()
                                    },

                                    formData.get(
                                        'rememberMe'
                                    ) === 'on'
                                );

                            showMessage(
                                result.message ||
                                'Account created successfully.',
                                'success'
                            );

                            window.setTimeout(
                                () => {
                                    window.location.replace(
                                        'dashboard.html'
                                    );
                                },
                                500
                            );

                        } catch (error) {
                            showMessage(
                                error.message ||
                                'Unable to create your account.'
                            );

                            button.disabled = false;
                            button.textContent =
                                'Create account';
                        }
                    }
                );
            }
        );
    </script>

</body>

</html>
